    .title-stage{position:relative;flex:0 0 216.32px;width:100%}

    .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    .camera-world{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 30%}
